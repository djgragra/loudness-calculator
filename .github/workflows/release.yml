name: Release

# Start from the Actions tab (or from a chat) with the version to publish: GitHub creates the tag on the tip of main
# and the release. The site then copies the app at that tag (scripts/sync-app.sh of onairgarage).
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to publish: the one in app.js and sw.js, for example 2026.10.1"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ github.event.inputs.release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The version is right, new and higher than the latest tag
        run: |
          VERSION="${RELEASE_VERSION#v}"
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::A release must run on main (this run is on $GITHUB_REF_NAME)"; exit 1
          fi
          if ! echo "$VERSION" | grep -Eq '^20[0-9]{2}\.[0-9]{1,2}\.[0-9]{1,3}$'; then
            echo "::error::The version must look like 2026.10.1 (year.month.number)"; exit 1
          fi
          CODE=$(grep -oE 'var VERSION = "[^"]+"' app.js | cut -d'"' -f2)
          CACHE=$(grep -oE 'const CACHE_VERSION = "v[^"]+"' sw.js | cut -d'"' -f2 | sed 's/^v//')
          if [ "$VERSION" != "$CODE" ] || [ "$VERSION" != "$CACHE" ]; then
            echo "::error::Version $VERSION does not match app.js ($CODE) and sw.js ($CACHE)"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists: use a higher version"; exit 1
          fi
          LATEST=$(git tag -l 'v20*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)
          echo "version: $VERSION  latest tag: ${LATEST:-none}"
          if [ -n "$LATEST" ]; then
            node -e '
              const p = (v) => v.split(".").map((n) => parseInt(n, 10) || 0);
              const [a, b] = [p(process.argv[1]), p(process.argv[2])];
              for (let i = 0; i < Math.max(a.length, b.length); i++) {
                const d = (a[i] || 0) - (b[i] || 0);
                if (d) process.exit(d > 0 ? 0 : 1);
              }
              process.exit(1);
            ' "$VERSION" "$LATEST" || { echo "::error::Version $VERSION must be greater than the latest tag $LATEST"; exit 1; }
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Tests
        run: node --test dev/*.test.js

      - name: Build the three manuals (PDF)
        env:
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          mkdir -p manuals
          python3 dev/manual/build.py "${RELEASE_VERSION#v}" manuals
          ls -l manuals

      - name: Tag and release
        uses: softprops/action-gh-release@v3
        with:
          files: manuals/*.pdf
          tag_name: v${{ github.event.inputs.release_version }}
          target_commitish: ${{ github.sha }}
          name: Loudness Calculator ${{ github.event.inputs.release_version }}
          body: |
            Loudness Calculator ${{ github.event.inputs.release_version }}: https://onairgarage.com/tools/loudness-calculator/
          make_latest: true
